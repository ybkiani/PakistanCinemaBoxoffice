name: Daily Pakistan cinema update

on:
  workflow_dispatch:
  schedule:
    # 03:15 UTC = 08:15 Pakistan Standard Time
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update cinema data
        run: python scripts/update_movies.py

      - name: Validate JSON
        run: python -m json.tool data/movies.json > /dev/null

      - name: Commit changes
        run: |
          git config user.name "pakistan-cinema-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/movies.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily cinema data update"
          git push
